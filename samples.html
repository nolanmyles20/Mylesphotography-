<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Images | Myles Photography LLC</title>

  <!-- Global site styles -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- Swiper -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    /* ===== PAGE OVERRIDES (SAFE) ===== */

    html, body.page-samples {
      overflow-x: hidden;
    }

    main.page {
      scroll-snap-type: y mandatory;
      overflow-y: auto;
    }

    /* Kill global 100vh panel behavior ONLY on this page */
    body.page-samples .panel {
      min-height: unset !important;
      height: auto !important;
      padding: 1.6rem 0 2rem;
      scroll-snap-align: start;
    }

    /* Grey cards */
    body.page-samples .morph-bg {
      width: min(94vw, 900px);
      margin: 0 auto;
      padding: 1.6rem 1.4rem 1.8rem;
      border-radius: 26px;
      background: linear-gradient(135deg, #8b8b8b, #333333);
      box-sizing: border-box;
    }

    /* Video frame (correct size, no dead space) */
    .video-lazy,
    .video-frame {
      width: 100%;
      max-width: 820px;
      aspect-ratio: 16 / 9;
      margin: 1.2rem auto 0;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* ===== STACKED SWIPER GALLERY ===== */

    .samples-swiper {
      width: 100%;
      height: 440px;
      padding: 2.6rem 0 3.4rem;
    }

    .samples-swiper .swiper-wrapper {
      align-items: center;
    }

    .samples-swiper .swiper-slide {
      width: 82vw;
      max-width: 460px;
      background: #111;
      border-radius: 22px;
      opacity: 0.35;
      transform: scale(0.92);
      transition: transform 0.4s ease, opacity 0.4s ease;
      box-shadow: 0 10px 26px rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .samples-swiper .swiper-slide-active {
      opacity: 1;
      transform: scale(1);
      z-index: 30;
    }

    .samples-swiper img {
      width: 100%;
      height: auto;
      border-radius: 22px;
      display: block;
    }

    .samples-swiper figcaption {
      margin-top: 0.6rem;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s ease;
      text-align: center;
    }

    .samples-swiper .swiper-slide-active figcaption {
      opacity: 1;
    }
  </style>
</head>

<body class="page-samples">

<!-- ===== HEADER (UNCHANGED) ===== -->
<header>
  <div class="container nav">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="Myles Photography LLC logo" class="logo" />
      <span>Myles Photography LLC</span>
    </a>

    <div class="services-tag">
      <span class="drone-wrap fly-in">
        <img src="assets/drone.png" class="services-drone" alt="">
      </span>
      <span>Drone Services</span>
    </div>

    <nav class="navlinks">
      <a href="samples.html" class="btn current">Sample Images</a>
      <a href="virtual-tours.html" class="btn">Virtual Tours</a>
      <a href="about.html" class="btn">About Us</a>
      <a href="locations.html" class="btn">Locations</a>
      <a href="payment.html" class="btn">Payment</a>
      <a href="contact.html" class="btn">Contact</a>
    </nav>

    <a class="faa-badge" href="about.html#faa-cert">
      <img src="assets/faa-badge.png" alt="FAA Certified Drone Pilot">
    </a>
  </div>
</header>

<main class="page">

  <!-- ===== INTRO CARD ===== -->
  <section class="panel panel-samples-intro">
    <div class="morph-bg">
      <h1>Sample Work</h1>
      <p>
        Premium waterfront, downtown commercial, and remote properties —
        we capture it all in high resolution.
      </p>

      <div class="video-lazy" data-video-id="iVyg4wXB2MM" data-autoplay="1"></div>
    </div>
  </section>

  <!-- ===== STACKED IMAGE GALLERY ===== -->
  <section class="panel">
    <div class="samples-swiper swiper">
      <div class="swiper-wrapper" id="gallery-wrapper"></div>
    </div>
  </section>

  <!-- ===== MORE VIDEOS ===== -->
  <section class="panel panel-more-video">
    <div class="morph-bg">
      <h2>More Video Samples</h2>

      <div class="video-lazy" data-video-id="INyz0gTMGc4"></div>
      <div class="video-lazy" data-video-id="_XxktVZ8k-M"></div>
    </div>
  </section>

</main>

<footer>
  <p>
    © 2025 Myles Photography LLC •
    <a href="mailto:nolanmyles@icloud.com">nolanmyles@icloud.com</a>
  </p>
</footer>

<!-- ===== SCRIPTS ===== -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
async function loadGallery() {
  const res = await fetch('assets/samples/manifest.json');
  const data = await res.json();
  const wrap = document.getElementById('gallery-wrapper');

  data.images.forEach(item => {
    const slide = document.createElement('div');
    slide.className = 'swiper-slide';
    slide.innerHTML = `
      <figure>
        <img src="assets/samples/${item.src}" alt="${item.caption || ''}">
        <figcaption>${item.caption || ''}</figcaption>
      </figure>
    `;
    wrap.appendChild(slide);
  });
}

function initVideos() {
  document.querySelectorAll('.video-lazy').forEach(div => {
    const id = div.dataset.videoId;
    const autoplay = div.dataset.autoplay === '1' ? '1' : '0';

    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${id}?autoplay=${autoplay}&mute=1`;
    iframe.allow =
      'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    iframe.loading = 'lazy';

    div.replaceWith(iframe);
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadGallery();

  new Swiper('.samples-swiper', {
    slidesPerView: 'auto',
    centeredSlides: true,
    spaceBetween: -140,
    grabCursor: true,
    freeMode: true,
    freeModeSticky: true,
    mousewheel: true
  });

  initVideos();
});
</script>

</body>
</html>
