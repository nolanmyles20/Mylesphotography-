<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Images | Myles Photography LLC</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    /* Use same scrolling behavior as index */
    main.page {
      scroll-snap-type: y mandatory;
      overflow-y: auto;
      overscroll-behavior-y: contain;
    }

    /* Make sure panels on this page aren’t dimmed by index “active” logic */
    body.page-samples .panel,
    body.page-samples .panel .content {
      opacity: 1 !important;
      transform: none !important;
      filter: none !important;
    }

    /* Grey gradient card look for intro & outro */
    body.page-samples .panel-samples-intro .morph-bg,
    body.page-samples .panel-more-video .morph-bg {
      background: linear-gradient(135deg, #8b8b8b, #333333);
      border-radius: 24px;
      width: min(92%, 900px);
      margin: 0 auto;
      padding: 1.8rem 1.5rem 2.1rem;
    }

    body.page-samples .panel-samples-intro h1 {
      margin-top: 0;
    }

    /* Video placeholder (we still lazy-replace with iframe) */
    .video-lazy {
      width: 100%;
      margin: 1.2rem auto 0;
      max-width: 100%;
      background: #111;
      border-radius: 18px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    /* -------- STACKED DECK GALLERY (Swiper) -------- */
    .samples-swiper {
      width: 100%;
      padding: 3rem 0 4rem;
      height: 440px; /* visible card zone */
      touch-action: pan-y pan-x;
    }

    .samples-swiper .swiper-wrapper {
      align-items: center;
    }

    .samples-swiper .swiper-slide {
      width: 82vw;
      max-width: 460px;
      background: #111;
      border-radius: 20px;
      opacity: 0.35;
      transform: scale(0.92);
      transition: transform 0.4s ease, opacity 0.4s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    .samples-swiper .swiper-slide-active {
      opacity: 1;
      transform: scale(1);
      z-index: 30;
    }

    .samples-swiper .swiper-slide-next,
    .samples-swiper .swiper-slide-prev {
      opacity: 0.65;
    }

    .samples-swiper img {
      width: 100%;
      height: auto;
      border-radius: 20px;
      display: block;
    }

    .samples-swiper figcaption {
      font-size: 1.15rem;
      margin-top: 0.55rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.35s ease;
      text-align: center;
    }

    .samples-swiper .swiper-slide-active figcaption {
      opacity: 1;
    }

    /* Make panels snap nicely on this page */
    body.page-samples .panel {
      scroll-snap-align: center;
      padding: 1.8rem 0 2.6rem;
    }

    /* ===========================
       ✅ DEADSPACE FIX (ADD THIS)
       =========================== */

    body.page-samples .panel {
      min-height: unset !important;
      height: auto !important;
    }

    body.page-samples .panel-samples-intro,
    body.page-samples .panel-more-video {
      padding: 1.2rem 0 1.4rem !important;
      scroll-snap-align: start;
    }

    body.page-samples .panel-samples-intro .morph-bg,
    body.page-samples .panel-more-video .morph-bg {
      padding: 1.4rem 1.4rem 1.4rem !important;
    }

    body.page-samples .panel-samples-intro .video-lazy,
    body.page-samples .panel-more-video .video-lazy {
      margin-top: 0.9rem !important;
    }
  </style>
</head>

<body class="page-samples">
  <header>
    <div class="container nav">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Myles Photography LLC logo" class="logo" />
        <span>Myles Photography LLC</span>
      </a>

      <div class="services-tag">
        <span class="drone-wrap fly-in" aria-hidden="true">
          <img src="assets/drone.png" alt="Drone icon" class="services-drone">
        </span>
        <span>Drone Services</span>
      </div>

      <nav class="navlinks">
        <a href="samples.html" class="btn current">Sample Images</a>
        <a href="virtual-tours.html" class="btn">Virtual Tours</a>
        <a href="about.html" class="btn">About Us</a>
        <a href="locations.html" class="btn">Locations</a>
        <a href="payment.html" class="btn">Payment</a>
        <a href="contact.html" class="btn">Contact</a>
      </nav>

      <a class="faa-badge" href="about.html#faa-cert" aria-label="FAA Certified Drone Pilot">
        <img src="assets/faa-badge.png" alt="FAA Certified Drone Pilot badge">
      </a>
    </div>
  </header>

  <main class="page">
    <section class="panel panel-samples-intro">
      <div class="morph-bg">
        <h1>Sample Work</h1>
        <p>Premium waterfront, downtown commercial, and remote properties — we capture it all in high resolution.</p>
        <div class="video-lazy" data-video-id="iVyg4wXB2MM" data-autoplay="1"></div>
      </div>
    </section>

    <section class="panel">
      <div class="samples-swiper swiper">
        <div class="swiper-wrapper" id="gallery-wrapper"></div>
      </div>
    </section>

    <section class="panel panel-more-video">
      <div class="morph-bg">
        <h2>More Video Samples</h2>
        <div class="video-lazy" data-video-id="INyz0gTMGc4" data-autoplay="0"></div>
        <div class="video-lazy" data-video-id="_XxktVZ8k-M" data-autoplay="0"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Myles Photography LLC •
      <a href="mailto:nolanmyles@icloud.com">nolanmyles@icloud.com</a>
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    async function loadGallery() {
      const res = await fetch('assets/samples/manifest.json');
      const data = await res.json();
      const wrap = document.getElementById('gallery-wrapper');

      if (!data.images || !Array.isArray(data.images)) return;

      data.images.forEach(item => {
        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        slide.innerHTML = `
          <figure>
            <img src="assets/samples/${item.src}" alt="${item.caption || 'Sample image'}">
            <figcaption>${item.caption || ''}</figcaption>
          </figure>
        `;
        wrap.appendChild(slide);
      });
    }

    function initLazyVideos() {
      const vids = document.querySelectorAll('.video-lazy');
      vids.forEach(div => {
        const id = div.dataset.videoId;
        if (!id) return;
        const autoplay = div.dataset.autoplay === '1' ? '1' : '0';

        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${id}?autoplay=${autoplay}&mute=1`;
        iframe.allowFullscreen = true;
        iframe.loading = 'lazy';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';

        div.replaceWith(iframe);
      });
    }

    async function init() {
      await loadGallery();

      new Swiper('.samples-swiper', {
        effect: 'slide',
        centeredSlides: true,
        slidesPerView: 'auto',
        spaceBetween: -140,
        freeMode: true,
        freeModeSticky: true,
        mousewheel: true,
        grabCursor: true
      });

      initLazyVideos();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
