<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Images | Myles Photography LLC</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- PAGE-SPECIFIC STYLES -->
  <style>
    /* Use same snap feel as index */
    main.page {
      scroll-snap-type: y proximity;
    }

    .panel-samples-intro .content {
      max-width: 88%;
      margin: 0 auto;
      padding-bottom: 4rem;
    }

    /* -----------------------
       Lightbox + gallery
       ----------------------- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      display: none;
      place-items: center;
      z-index: 9999;
      padding: 20px;
    }
    .lightbox.open { display: grid; }
    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      display: block;
    }
    .lightbox-cap {
      color: #ccc;
      margin-top: 10px;
      text-align: center;
      max-width: 90vw;
    }
    .lightbox-close {
      position: absolute;
      top: 14px;
      right: 18px;
      background: #111;
      color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1;
      padding: 8px 12px;
      cursor: pointer;
    }

    /* Spinner */
    .gallery figure {
      position: relative;
    }
    .gallery figure.is-loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 34px;
      height: 34px;
      margin: -17px 0 0 -17px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #ffffff;
      animation: gallerySpin .8s linear infinite;
      pointer-events: none;
      z-index: 2;
    }
    @keyframes gallerySpin { to { transform: rotate(360deg); } }
    .gallery figure.is-loading img {
      opacity: 0.2;
      transition: opacity 0.25s ease;
    }
    .gallery figure img.loaded {
      opacity: 1;
    }

    /* Lazy YouTube placeholders */
    .video-lazy {
      position: relative;
      width: 100%;
      max-width: 960px;
      margin: 1.5rem auto;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    .video-lazy::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      margin: -20px 0 0 -20px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #ffffff;
      animation: videoSpin .8s linear infinite;
      pointer-events: none;
    }
    @keyframes videoSpin { to { transform: rotate(360deg); } }

    /* -----------------------
       STACKED PHOTO DECK
       ----------------------- */

    /* Each gallery panel behaves like a full-screen slide */
    body.page-samples .panel-gallery {
      position: relative;
      display: flex !important;
      align-items: center;
      justify-content: center;
      max-width: 100% !important;
      min-height: 100vh !important;      /* full viewport */
      padding: 0 1rem 8vh !important;
      margin: 0 auto !important;
      scroll-snap-align: center;
      transition:
        transform 260ms ease-out,
        opacity 260ms ease-out,
        filter 260ms ease-out;
      z-index: 1;
    }

    /* Big negative margin so cards overlap like a deck */
    body.page-samples .panel-gallery + .panel-gallery {
      margin-top: -40vh !important;  /* increase for more overlap */
    }

    /* Card / image styling */
    body.page-samples .gallery {
      width: 100%;
    }
    body.page-samples .gallery figure {
      background: none !important;
      border: none !important;
      border-radius: 0 !important;
      margin: 0 auto;
      max-width: 94vw;
      text-align: center;
    }
    body.page-samples .gallery img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
    }
    body.page-samples .gallery figcaption {
      margin-top: 0.75rem;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
    }

    /* Bright top card */
    body.page-samples .panel-gallery.card-top {
      transform: translateY(0) scale(1);
      opacity: 1;
      z-index: 40;
      filter: brightness(1) contrast(1.02);
      box-shadow: 0 14px 40px rgba(0,0,0,0.7);
    }

    /* Cards still ahead in the deck (beneath current) */
    body.page-samples .panel-gallery.card-behind {
      transform: translateY(50px) scale(0.92);
      opacity: 0.75;
      z-index: 30;
      filter: brightness(0.85);
    }

    /* Cards you already scrolled past (above current) */
    body.page-samples .panel-gallery.card-past {
      transform: translateY(-50px) scale(0.9);
      opacity: 0.35;
      z-index: 20;
      filter: brightness(0.75);
    }
  </style>
</head>

<body class="page-samples">
  <header>
    <div class="container nav">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Myles Photography LLC logo" class="logo" />
        <span>Myles Photography LLC</span>
      </a>
      <div class="services-tag">
        <span class="drone-wrap fly-in" aria-hidden="true">
          <img src="assets/drone.png" alt="Drone icon" class="services-drone">
        </span>
        <span>Drone Services</span>
      </div>
      <nav class="navlinks">
        <a href="samples.html" class="btn current">Sample Images</a>
        <a href="virtual-tours.html" class="btn">Virtual Tours</a>
        <a href="about.html" class="btn">About Us</a>
        <a href="locations.html" class="btn">Locations</a>
        <a href="payment.html" class="btn">Payment</a>
        <a href="contact.html" class="btn">Contact</a>
      </nav>
      <a class="faa-badge" href="about.html#faa-cert" aria-label="FAA Certified Drone Pilot">
        <img src="assets/faa-badge.png" alt="FAA Certified Drone Pilot badge">
      </a>
    </div>
  </header>

  <!-- SNAPPING CONTAINER -->
  <main class="page">

    <!-- PANEL 1: Intro + Featured Video -->
    <section class="panel panel-samples-intro">
      <div class="morph-bg"></div>
      <div class="content">
        <h1>Sample Work</h1>
        <p>Premium waterfront, downtown commercial, and rural properties — we cover it all.</p>

        <div class="video-grid" style="margin-top:2rem;">
          <div class="video-lazy" data-video-id="iVyg4wXB2MM" data-autoplay="1"></div>
        </div>
      </div>
    </section>

    <!-- GALLERY PANELS INSERTED HERE -->
    <div id="gallery-panels-anchor"></div>

    <!-- PANEL 3: More Videos -->
    <section class="panel panel-more-video">
      <div class="morph-bg"></div>
      <div class="content">
        <h2 style="margin-bottom:1.5rem; text-align:center;">More Sample Videos</h2>
        <div class="video-grid">
          <div class="video-lazy" data-video-id="INyz0gTMGc4" data-autoplay="0"></div>
        </div>
        <div class="video-grid">
          <div class="video-lazy" data-video-id="_XxktVZ8k-M" data-autoplay="0"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close">×</button>
    <img id="lightbox-img" alt="" />
    <div id="lightbox-cap" class="lightbox-cap"></div>
  </div>

  <footer>
    <p>© 2025 Myles Photography LLC • <a href="mailto:nolanmyles@icloud.com">nolanmyles@icloud.com</a></p>
  </footer>

  <!-- ======================
       SCRIPTS
       ====================== -->
  <script>
    async function loadGallery() {
      const anchor = document.getElementById('gallery-panels-anchor');

      const imgObserver = 'IntersectionObserver' in window
        ? new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
              if (!entry.isIntersecting) return;
              const img = entry.target;
              const src = img.dataset.src;
              if (src && !img.src) img.src = src;
              obs.unobserve(img);
            });
          }, { rootMargin: '300px 0px' })
        : null;

      try {
        const res = await fetch('assets/samples/manifest.json');
        if (!res.ok) throw new Error('manifest not found');
        const data = await res.json();
        if (!data.images || !Array.isArray(data.images)) throw new Error('invalid manifest');

        data.images.forEach(item => {
          const panel = document.createElement('section');
          panel.className = 'panel panel-gallery';

          const content = document.createElement('div');
          content.className = 'content';

          const galleryWrap = document.createElement('div');
          galleryWrap.className = 'gallery';

          const fig = document.createElement('figure');
          fig.classList.add('is-loading');

          const link = document.createElement('a');
          const img = document.createElement('img');
          const cap = document.createElement('figcaption');

          const fullSrc = 'assets/samples/' + item.src;

          link.href = fullSrc;
          link.className = 'lb';

          img.dataset.src = fullSrc;
          img.alt = item.caption || 'Sample image';

          img.addEventListener('load', () => {
            fig.classList.remove('is-loading');
            img.classList.add('loaded');
          });

          img.addEventListener('error', () => {
            fig.classList.remove('is-loading');
            img.classList.add('loaded');
          });

          cap.textContent = item.caption || '';

          link.appendChild(img);
          fig.appendChild(link);
          fig.appendChild(cap);
          galleryWrap.appendChild(fig);
          content.appendChild(galleryWrap);
          panel.appendChild(content);
          anchor.appendChild(panel);

          if (imgObserver) imgObserver.observe(img);
          else img.src = fullSrc;
        });

        initDeckScroll();
        initLightbox(anchor);

      } catch (e) {
        console.error(e);
        anchor.innerHTML =
          '<section class="panel panel-gallery"><div class="content"><p style="color:#bbb">No manifest found. Create <code>assets/samples/manifest.json</code> to list your images.</p></div></section>';
      }
    }

    function initLightbox(anchor) {
      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lightbox-img');
      const lbCap = document.getElementById('lightbox-cap');
      const closeBtn = document.querySelector('.lightbox-close');

      anchor.addEventListener('click', (e) => {
        const a = e.target.closest('a.lb');
        if (!a) return;
        e.preventDefault();
        lbImg.src = a.href;
        lbCap.textContent = a.parentElement.querySelector('figcaption')?.textContent || '';
        lb.classList.add('open');
        lb.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      });

      closeBtn.addEventListener('click', () => {
        lb.classList.remove('open');
        lb.setAttribute('aria-hidden', 'true');
        lbImg.src = '';
        document.body.style.overflow = '';
      });

      lb.addEventListener('click', (e) => {
        if (e.target === lb) closeBtn.click();
      });
    }

    /* STACKED PHOTO DECK: card nearest middle of screen is "top" */
    function initDeckScroll() {
      const cards = Array.from(document.querySelectorAll('.panel-gallery'));
      if (!cards.length) return;

      let ticking = false;

      function applyDeckClasses() {
        const midY = window.innerHeight * 0.5;
        let bestIdx = 0;
        let bestDist = Infinity;

        cards.forEach((card, i) => {
          const rect = card.getBoundingClientRect();
          const center = rect.top + rect.height / 2;
          const dist = Math.abs(center - midY);
          if (dist < bestDist) {
            bestDist = dist;
            bestIdx = i;
          }
        });

        cards.forEach(card => {
          card.classList.remove('card-top', 'card-behind', 'card-past');
        });

        cards.forEach((card, i) => {
          if (i === bestIdx) {
            card.classList.add('card-top');
          } else if (i > bestIdx) {
            card.classList.add('card-behind');
          } else {
            card.classList.add('card-past');
          }
        });
      }

      function onScroll() {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(() => {
            applyDeckClasses();
            ticking = false;
          });
        }
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      applyDeckClasses();
    }

    /* Lazy YouTube videos */
    function initLazyVideos() {
      const videos = document.querySelectorAll('.video-lazy');
      if (!videos.length) return;

      function loadIframe(div) {
        const id = div.dataset.videoId;
        if (!id) return;
        const autoplay = div.dataset.autoplay === '1' ? '1' : '0';

        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${id}?autoplay=${autoplay}&mute=1`;
        iframe.frameBorder = "0";
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;
        iframe.loading = "lazy";
        iframe.style.width = "100%";
        iframe.style.height = "100%";

        div.replaceWith(iframe);
      }

      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            loadIframe(entry.target);
            obs.unobserve(entry.target);
          });
        }, { rootMargin: '300px 0px' });

        videos.forEach(div => observer.observe(div));
      } else {
        videos.forEach(loadIframe);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadGallery();
      initLazyVideos();
    });
  </script>
</body>
</html>
