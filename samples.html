<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Images | Myles Photography LLC</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- PAGE-SPECIFIC STYLES -->
  <style>
    /* No snap on this page – scroll is used as a scrubber for the deck */
    main.page {
      min-height: 100vh;
      scroll-snap-type: none;
      overflow-y: auto;
    }

    /* Intro + More Video panels keep the grey morph card */
    body.page-samples .panel-samples-intro .morph-bg,
    body.page-samples .panel-more-video .morph-bg {
      background: linear-gradient(135deg, #8b8b8b, #333333);
      opacity: 1;
    }
    body.page-samples .panel-samples-intro .content,
    body.page-samples .panel-more-video .content {
      max-width: 88%;
      margin: 0 auto;
    }

    /* ---------- DECK AREA ---------- */

    /* Whole gallery section just provides scroll height */
    .panel-gallery-deck {
      position: relative;
      padding: 3rem 0;
    }

    /* The actual “hand of photos” lives here and stays put */
    .deck-root {
      position: sticky;
      top: 7rem; /* sits just below your nav on mobile */
      height: calc(100vh - 10rem);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none; /* re-enabled on top card only */
    }

    .deck-inner {
      position: relative;
      width: 100%;
      max-width: 80vw;
      height: 100%;
    }

    .deck-card {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .deck-card img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 22px;
    }

    .deck-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2.2rem;
      text-align: center;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #e4e4e4;
    }

    /* Current card – bright & on top */
    .deck-card.is-current {
      opacity: 1;
      transform: scale(1);
      z-index: 3;
      pointer-events: auto; /* clicks allowed for lightbox */
    }

    /* Next card – very subtle shadow behind current */
    .deck-card.is-next {
      opacity: 0.25;
      transform: scale(0.96);
      z-index: 2;
    }

    /* Previous cards are completely hidden */
    .deck-card.is-prev {
      opacity: 0;
      z-index: 1;
    }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.85);
      display: none; place-items: center;
      z-index: 9999; padding: 20px;
    }
    .lightbox.open { display: grid; }
    .lightbox img {
      max-width: 92vw; max-height: 88vh;
      border-radius: 16px;
    }
    .lightbox-cap {
      color: #ccc;
      margin-top: 10px;
      text-align: center;
      max-width: 90vw;
    }
    .lightbox-close {
      position: absolute; top: 14px; right: 18px;
      background: #111; color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
      font-size: 20px; line-height: 1;
      padding: 8px 12px; cursor: pointer;
    }

    /* Lazy video placeholder */
    .video-lazy {
      position: relative;
      width: 92vw;
      margin: 1.3rem auto 0 auto;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    .video-lazy::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 34px; height: 34px;
      margin:-17px 0 0 -17px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color:#fff;
      animation: videoSpin .8s linear infinite;
    }
    @keyframes videoSpin { to { transform: rotate(360deg); } }
  </style>
</head>

<body class="page-samples">
  <header>
    <div class="container nav">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Myles Photography LLC logo" class="logo" />
        <span>Myles Photography LLC</span>
      </a>
      <div class="services-tag">
        <span class="drone-wrap fly-in" aria-hidden="true">
          <img src="assets/drone.png" alt="Drone icon" class="services-drone">
        </span>
        <span>Drone Services</span>
      </div>
      <nav class="navlinks">
        <a href="samples.html" class="btn current">Sample Images</a>
        <a href="virtual-tours.html" class="btn">Virtual Tours</a>
        <a href="about.html" class="btn">About Us</a>
        <a href="locations.html" class="btn">Locations</a>
        <a href="payment.html" class="btn">Payment</a>
        <a href="contact.html" class="btn">Contact</a>
      </nav>
      <a class="faa-badge" href="about.html#faa-cert" aria-label="FAA Certified Drone Pilot">
        <img src="assets/faa-badge.png" alt="FAA Certified Drone Pilot badge">
      </a>
    </div>
  </header>

  <main class="page">
    <!-- Intro panel with grey card + featured video -->
    <section class="panel panel-samples-intro">
      <div class="morph-bg"></div>
      <div class="content">
        <h1>Sample Work</h1>
        <p>Premium waterfront, downtown commercial, or middle of nowhere — we capture it all.</p>
        <div class="video-lazy" data-video-id="iVyg4wXB2MM" data-autoplay="1"></div>
      </div>
    </section>

    <!-- DECK PANEL (all images live here, stacked) -->
    <section class="panel panel-gallery-deck" id="deck-panel">
      <div class="deck-root">
        <div class="deck-inner" id="deck-inner">
          <!-- JS injects .deck-card elements -->
        </div>
      </div>
    </section>

    <!-- Extra video panel at the end -->
    <section class="panel panel-more-video">
      <div class="morph-bg"></div>
      <div class="content">
        <h2 style="text-align:center;">More Video Samples</h2>
        <div class="video-lazy" data-video-id="INyz0gTMGc4" data-autoplay="0"></div>
        <div class="video-lazy" data-video-id="_XxktVZ8k-M" data-autoplay="0"></div>
      </div>
    </section>
  </main>

  <!-- Lightbox overlay -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close">×</button>
    <img id="lightbox-img" alt="" />
    <div id="lightbox-cap" class="lightbox-cap"></div>
  </div>

  <footer>
    <p>© 2025 Myles Photography LLC • <a href="mailto:nolanmyles@icloud.com">nolanmyles@icloud.com</a></p>
  </footer>

  <script>
    // ---------- Lazy YouTube ----------
    function initLazyVideos() {
      const videos = document.querySelectorAll('.video-lazy');
      if (!videos.length) return;

      function loadIframe(div) {
        const id = div.dataset.videoId;
        if (!id) return;
        const autoplay = div.dataset.autoplay === '1' ? '1' : '0';

        const iframe = document.createElement('iframe');
        iframe.src =
          `https://www.youtube.com/embed/${id}?autoplay=${autoplay}&mute=1`;
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;
        iframe.loading = "lazy";
        iframe.style.width = "100%";
        iframe.style.height = "100%";

        div.replaceWith(iframe);
      }

      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            loadIframe(entry.target);
            obs.unobserve(entry.target);
          });
        }, { rootMargin: '300px 0px' });

        videos.forEach(div => observer.observe(div));
      } else {
        videos.forEach(loadIframe);
      }
    }

    // ---------- Build deck from manifest ----------
    async function buildDeck() {
      const deckInner = document.getElementById('deck-inner');
      const deckPanel = document.getElementById('deck-panel');
      if (!deckInner || !deckPanel) return;

      try {
        const res = await fetch('assets/samples/manifest.json');
        if (!res.ok) throw new Error('manifest not found');
        const data = await res.json();
        if (!data.images || !Array.isArray(data.images)) throw new Error('invalid manifest');

        const cards = [];

        data.images.forEach((item, idx) => {
          const card = document.createElement('article');
          card.className = 'deck-card';

          const link = document.createElement('a');
          link.href = 'assets/samples/' + item.src;
          link.className = 'deck-link';

          const img = document.createElement('img');
          img.src = 'assets/samples/' + item.src;
          img.alt = item.caption || 'Sample image';

          const cap = document.createElement('div');
          cap.className = 'deck-caption';
          cap.textContent = item.caption || '';

          link.appendChild(img);
          card.appendChild(link);
          card.appendChild(cap);
          deckInner.appendChild(card);

          cards.push(card);
        });

        // Give the deck panel enough scroll height: one "step" per image
        const step = window.innerHeight * 0.7;
        const extra = window.innerHeight * 0.3;
        deckPanel.style.minHeight = (step * (cards.length - 1) + extra) + 'px';

        // Scroll-driven card selection
        function updateDeck() {
          const rect = deckPanel.getBoundingClientRect();
          const totalScrollable = deckPanel.offsetHeight - window.innerHeight;
          let offsetInside = -rect.top;

          if (offsetInside < 0) offsetInside = 0;
          if (totalScrollable > 0 && offsetInside > totalScrollable) {
            offsetInside = totalScrollable;
          }

          const index = Math.round(offsetInside / step);

          cards.forEach((card, i) => {
            const diff = i - index;
            card.classList.remove('is-current', 'is-next', 'is-prev');

            if (diff === 0) {
              card.classList.add('is-current');
            } else if (diff === 1) {
              card.classList.add('is-next');
            } else if (diff < 0) {
              card.classList.add('is-prev');
            } else {
              // future cards beyond next: keep hidden default
            }
          });
        }

        updateDeck();
        window.addEventListener('scroll', updateDeck);
        window.addEventListener('resize', () => {
          // Recompute panel height on resize
          const stepNew = window.innerHeight * 0.7;
          const extraNew = window.innerHeight * 0.3;
          deckPanel.style.minHeight =
            (stepNew * (cards.length - 1) + extraNew) + 'px';
          updateDeck();
        });

        // ---------- Lightbox ----------
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');
        const lbCap = document.getElementById('lightbox-cap');
        const closeBtn = document.querySelector('.lightbox-close');

        deckInner.addEventListener('click', (e) => {
          const link = e.target.closest('.deck-link');
          if (!link) return;
          e.preventDefault();
          const card = link.closest('.deck-card');
          lbImg.src = link.href;
          lbCap.textContent =
            card.querySelector('.deck-caption')?.textContent || '';
          lb.classList.add('open');
          lb.setAttribute('aria-hidden', 'false');
          document.body.style.overflow = 'hidden';
        });

        closeBtn.addEventListener('click', () => {
          lb.classList.remove('open');
          lb.setAttribute('aria-hidden', 'true');
          lbImg.src = '';
          document.body.style.overflow = '';
        });

        lb.addEventListener('click', (e) => {
          if (e.target === lb) closeBtn.click();
        });

      } catch (e) {
        console.error(e);
        deckInner.innerHTML =
          '<p style="color:#bbb;text-align:center;">No manifest found. Create <code>assets/samples/manifest.json</code> to list your images.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initLazyVideos();
      buildDeck();
    });
  </script>
</body>
</html>
