<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Images | Myles Photography LLC</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- PAGE-SPECIFIC STYLES -->
  <style>
    /* Scroll snapping similar to index */
    main.page {
      scroll-snap-type: y mandatory;
      overflow-y: auto;
      overscroll-behavior-y: contain;
    }
    body.page-samples .panel {
      scroll-snap-align: center;
      padding: 1.6rem 0 2.6rem;
    }

    /* Intro + More Video panels keep the grey morph card */
    body.page-samples .panel-samples-intro .morph-bg,
    body.page-samples .panel-more-video .morph-bg {
      background: linear-gradient(135deg, #8b8b8b, #333333);
      opacity: 1;
    }
    body.page-samples .panel-samples-intro .content,
    body.page-samples .panel-more-video .content {
      max-width: 88%;
      margin: 0 auto;
    }

    /* ---------- DECK STYLE GALLERY ---------- */

    /* Each gallery panel reacts to --deckProgress (0 far, 1 centered) */
    body.page-samples .panel-gallery {
      --deckProgress: 0;

      display: flex !important;
      justify-content: center;
      align-items: center;
      padding: 0.8rem 0 2.8rem;
      transition: transform 0.25s ease, opacity 0.25s ease;

      opacity: calc(0.45 + var(--deckProgress) * 0.55);
      transform:
        translateY(calc((1 - var(--deckProgress)) * 14px))
        scale(calc(0.94 + var(--deckProgress) * 0.06));
    }

    /* Overlap so the next card peeks from behind */
    body.page-samples .panel-gallery + .panel-gallery {
      margin-top: -6.5rem;
    }

    /* ---------- IMAGE SIZING ---------- */
    body.page-samples .gallery {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    body.page-samples .gallery figure {
      margin: 0 auto;
      max-width: 80vw !important;  /* narrower card */
      border: none !important;
      background: transparent !important;
      text-align: center;
      position: relative;
    }

    body.page-samples .gallery img {
      display: block;
      width: 100% !important;
      height: auto !important;
      max-height: 40vh !important;
      object-fit: contain !important;
      border-radius: 22px;
    }

    body.page-samples .gallery figcaption {
      margin-top: 0.7rem;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #e4e4e4;
    }

    /* Loading spinner */
    body.page-samples .gallery figure.is-loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 32px;
      height: 32px;
      margin: -16px 0 0 -16px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      animation: gallerySpin 0.9s linear infinite;
      pointer-events: none;
    }
    @keyframes gallerySpin {
      to { transform: rotate(360deg); }
    }

    /* ---------- Lightbox ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      place-items: center;
      z-index: 9999;
      padding: 20px;
    }
    .lightbox.open { display: grid; }
    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 16px;
    }
    .lightbox-cap {
      color: #ccc;
      margin-top: 10px;
      text-align: center;
      max-width: 90vw;
    }
    .lightbox-close {
      position: absolute;
      top: 14px;
      right: 18px;
      background: #111;
      color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1;
      padding: 8px 12px;
      cursor: pointer;
    }

    /* ---------- Video placeholder (lazy load) ---------- */
    .video-lazy {
      position: relative;
      width: 92vw;
      margin: 1.3rem auto 0 auto;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    .video-lazy::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 34px;
      height: 34px;
      margin: -17px 0 0 -17px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      animation: videoSpin 0.8s linear infinite;
    }
    @keyframes videoSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body class="page-samples">
  <header>
    <div class="container nav">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Myles Photography LLC logo" class="logo" />
        <span>Myles Photography LLC</span>
      </a>
      <div class="services-tag">
        <span class="drone-wrap fly-in" aria-hidden="true">
          <img src="assets/drone.png" alt="Drone icon" class="services-drone">
        </span>
        <span>Drone Services</span>
      </div>
      <nav class="navlinks">
        <a href="samples.html" class="btn current">Sample Images</a>
        <a href="virtual-tours.html" class="btn">Virtual Tours</a>
        <a href="about.html" class="btn">About Us</a>
        <a href="locations.html" class="btn">Locations</a>
        <a href="payment.html" class="btn">Payment</a>
        <a href="contact.html" class="btn">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <!-- Intro panel with grey card + featured video -->
    <section class="panel panel-samples-intro">
      <div class="morph-bg"></div>
      <div class="content">
        <h1>Sample Work</h1>
        <p>Premium waterfront, downtown commercial, or middle of nowhere — we capture it all.</p>
        <div class="video-lazy" data-video-id="iVyg4wXB2MM" data-autoplay="1"></div>
      </div>
    </section>

    <!-- Gallery panels get injected here -->
    <div id="gallery-panels-anchor"></div>

    <!-- Extra video panel at the end -->
    <section class="panel panel-more-video">
      <div class="morph-bg"></div>
      <div class="content">
        <h2 style="text-align:center;">More Video Samples</h2>
        <div class="video-lazy" data-video-id="INyz0gTMGc4" data-autoplay="0"></div>
        <div class="video-lazy" data-video-id="_XxktVZ8k-M" data-autoplay="0"></div>
      </div>
    </section>
  </main>

  <!-- Lightbox overlay -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close">×</button>
    <img id="lightbox-img" alt="" />
    <div id="lightbox-cap" class="lightbox-cap"></div>
  </div>

  <footer>
    <p>© 2025 Myles Photography LLC • <a href="mailto:nolanmyles@icloud.com">nolanmyles@icloud.com</a></p>
  </footer>

  <script>
    let panelObserver = null;

    function setupPanelObserver() {
      if (panelObserver) return;
      panelObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
            entry.target.classList.add("active");
          }
        });
      }, { threshold: 0.35 });
    }

    /* NEW: deck-style fade/scale based on distance from screen center */
    let deckEffectsAttached = false;
    function initDeckEffects() {
      if (deckEffectsAttached) return;

      const scroller = document.querySelector('main.page') || window;
      if (!scroller) return;

      const update = () => {
        const vh = window.innerHeight || scroller.clientHeight || 1;
        const center = vh / 2;

        document.querySelectorAll('.panel-gallery').forEach(p => {
          const rect = p.getBoundingClientRect();
          const cardCenter = rect.top + rect.height / 2;
          const dist = Math.abs(cardCenter - center);

          // 0 when centered, approaching 1 as it gets farther away
          const norm = Math.min(1, dist / (vh * 0.7));
          const progress = 1 - norm; // 1 = centered, 0 = far

          p.style.setProperty('--deckProgress', progress.toFixed(3));
        });
      };

      const target = scroller === window ? window : scroller;
      target.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update);
      deckEffectsAttached = true;
      update();
    }

    async function loadGallery() {
      const anchor = document.getElementById('gallery-panels-anchor');

      const imgObserver = 'IntersectionObserver' in window
        ? new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
              if (!entry.isIntersecting) return;
              const img = entry.target;
              const src = img.dataset.src;
              if (src && !img.src) img.src = src;
              obs.unobserve(img);
            });
          }, { rootMargin: '200px 0px' })
        : null;

      try {
        const res = await fetch('assets/samples/manifest.json');
        if (!res.ok) throw new Error('manifest not found');
        const data = await res.json();
        if (!data.images || !Array.isArray(data.images)) throw new Error('invalid manifest');

        data.images.forEach(item => {
          const panel = document.createElement('section');
          panel.className = 'panel panel-gallery';

          const content = document.createElement('div');
          content.className = 'content';

          const galleryWrap = document.createElement('div');
          galleryWrap.className = 'gallery';

          const fig = document.createElement('figure');
          fig.classList.add('is-loading');

          const link = document.createElement('a');
          link.className = 'lb';

          const img = document.createElement('img');
          img.dataset.src = 'assets/samples/' + item.src;
          img.alt = item.caption || 'Sample image';

          img.addEventListener('load', () => {
            fig.classList.remove('is-loading');
            img.classList.add('loaded');
          });

          if (imgObserver) imgObserver.observe(img);
          else img.src = img.dataset.src;

          const cap = document.createElement('figcaption');
          cap.textContent = item.caption || '';

          link.href = img.dataset.src;
          link.appendChild(img);
          fig.appendChild(link);
          fig.appendChild(cap);
          galleryWrap.appendChild(fig);
          content.appendChild(galleryWrap);
          panel.appendChild(content);
          anchor.appendChild(panel);

          setupPanelObserver();
          panelObserver.observe(panel);
        });

        // after all panels are added, enable deck animation
        initDeckEffects();

      } catch (e) {
        console.error(e);
        anchor.innerHTML =
          '<section class="panel panel-gallery"><div class="content"><p style="color:#bbb">No manifest found. Create <code>assets/samples/manifest.json</code> to list your images.</p></div></section>';
      }
    }

    function initLazyVideos() {
      const videos = document.querySelectorAll('.video-lazy');
      if (!videos.length) return;

      function loadIframe(div) {
        const id = div.dataset.videoId;
        if (!id) return;
        const autoplay = div.dataset.autoplay === '1' ? '1' : '0';

        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${id}?autoplay=${autoplay}&mute=1`;
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;
        iframe.loading = "lazy";
        iframe.style.width = "100%";
        iframe.style.height = "100%";

        div.replaceWith(iframe);
      }

      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            loadIframe(entry.target);
            obs.unobserve(entry.target);
          });
        }, { rootMargin: '300px 0px' });

        videos.forEach(div => observer.observe(div));
      } else {
        videos.forEach(loadIframe);
      }
    }

    // Lightbox behavior
    document.addEventListener('click', (e) => {
      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lightbox-img');
      const lbCap = document.getElementById('lightbox-cap');

      const openLink = e.target.closest('a.lb');
      if (openLink) {
        e.preventDefault();
        lbImg.src = openLink.querySelector('img').src;
        lbCap.textContent = openLink.parentElement.querySelector('figcaption')?.textContent || '';
        lb.classList.add('open');
        lb.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        return;
      }

      if (e.target.classList.contains('lightbox-close') || e.target === lb) {
        lb.classList.remove('open');
        lb.setAttribute('aria-hidden', 'true');
        lbImg.src = '';
        document.body.style.overflow = '';
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      setupPanelObserver();
      // observe the static panels so intro/more-video get "active"
      document.querySelectorAll('.panel').forEach(p => panelObserver.observe(p));
      loadGallery();
      initLazyVideos();
    });
  </script>
</body>
</html>
