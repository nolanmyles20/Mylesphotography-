<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sample Images – Myles Photography LLC</title>

<style>
/* ------------ BASE RESET + PAGE BACKGROUND ------------ */
body, html {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    scroll-behavior: smooth;
}

/* ------------ NAVIGATION BAR ------------ */
header {
    background: #f2f2f2;
    color: #000;
    padding: 1rem 0 0.25rem;
    text-align: center;
}

.nav-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
}

.nav-buttons a {
    background: #fff;
    border: 2px solid #000;
    border-radius: 18px;
    padding: 10px 16px;
    font-weight: bold;
    color: #000;
    text-decoration: none;
}

.nav-buttons a.active {
    background: #000;
    color: #fff;
}

/* ------------ SCROLL SNAP FOR “CARD BY CARD” FEEL ------------ */
.page-samples {
    scroll-snap-type: y mandatory;
    overflow-y: auto;
}

/* ------------ GALLERY PANEL ------------ */
.panel-gallery {
    scroll-snap-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* ------------ IMAGE CARD ------------ */
.gallery figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 86vw;      /* card width */
}

.gallery img {
    width: 100%;
    height: auto;
    max-height: 45vh;     /* keeps full photo visible */
    object-fit: contain;
    border-radius: 28px;
    display: block;
}

/* ------------ CAPTION ------------ */
.gallery figcaption {
    margin-top: 10px;
    font-size: 22px;
    text-align: center;
    letter-spacing: 1px;
}

/* ------------ “DECK / STACK” OVERLAP EFFECT ------------ */
/* default spacing removed */
.panel-gallery {
    padding-top: 2rem;
    padding-bottom: 3rem;
    margin: 0 !important;
}

/* pull next card upward to peek behind */
.panel-gallery + .panel-gallery {
    margin-top: -6rem !important;   /* tweak overlap here: -4rem smaller, -8rem stronger */
}

/* increase overlap slightly on small phones */
@media (max-width: 390px) {
    .panel-gallery + .panel-gallery {
        margin-top: -7rem !important;
    }
}
</style>
</head>

<body class="page-samples">

<header>
    <img src="logo.png" alt="Myles Logo" width="60" />
    <h2 style="margin:6px 0 2px;">Drone Services</h2>
    <div class="nav-buttons">
        <a href="samples.html" class="active">Sample Images</a>
        <a href="virtual_tours.html">Virtual Tours</a>
        <a href="about.html">About Us</a>
        <a href="locations.html">Locations</a>
        <a href="payment.html">Payment</a>
        <a href="contact.html">Contact</a>
    </div>
</header>

<!-- ------------ GALLERY STACK / “CARD DECK” ------------ -->

<div class="panel-gallery gallery">
    <figure>
        <img src="gallery1.jpg" alt="Lake Front">
        <figcaption>LAKE FRONT</figcaption>
    </figure>
</div>

<div class="panel-gallery gallery">
    <figure>
        <img src="gallery2.jpg" alt="Harbor">
        <figcaption>HARBOR</figcaption>
    </figure>
</div>

<div class="panel-gallery gallery">
    <figure>
        <img src="gallery3.jpg" alt="Beach Front">
        <figcaption>BEACH FRONT</figcaption>
    </figure>
</div>

<div class="panel-gallery gallery">
    <figure>
        <img src="gallery4.jpg" alt="Rural Property">
        <figcaption>RURAL PROPERTY</figcaption>
    </figure>
</div>

<div class="panel-gallery gallery">
    <figure>
        <img src="gallery5.jpg" alt="Marina">
        <figcaption>MARINA</figcaption>
    </figure>
</div>

</body>
</html>
