<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Images | Myles Photography LLC</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- Swiper cards effect -->
  <link rel="stylesheet"
        href="https://unpkg.com/swiper@11/swiper-bundle.min.css" />

  <!-- PAGE-SPECIFIC STYLES -->
  <style>
    /* Main scroll behaviour for this page */
    main.page {
      scroll-snap-type: y mandatory;
      overflow-y: auto;
      overscroll-behavior-y: contain;
    }

    body.page-samples .panel {
      scroll-snap-align: center;
      padding: 1.6rem 0 2.6rem;
    }

    /* Intro + More Video panels keep the grey morph card */
    body.page-samples .panel-samples-intro .morph-bg,
    body.page-samples .panel-more-video .morph-bg {
      background: linear-gradient(135deg, #8b8b8b, #333333);
      opacity: 1;
    }
    body.page-samples .panel-samples-intro .content,
    body.page-samples .panel-more-video .content {
      max-width: 88%;
      margin: 0 auto;
    }

    /* ---------- SWIPER DECK ---------- */
    .samples-swiper {
      width: 100%;
      max-width: 960px;
      height: 65vh;
      margin: 2rem auto 1rem auto;
      position: relative;
    }

    .samples-swiper .swiper-slide {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.28s ease, transform 0.28s ease,
                  filter 0.28s ease;
      opacity: 0.3;
      transform: scale(0.9) translateY(10px);
      filter: blur(1px);
    }

    .samples-swiper .swiper-slide figure {
      margin: 0;
      width: 80vw;
      max-width: 820px;
      border-radius: 22px;
      overflow: hidden;
      text-align: center;
      background: transparent;
    }

    .samples-swiper .swiper-slide img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 40vh;
      object-fit: contain;
      border-radius: 22px;
    }

    .samples-swiper .swiper-slide figcaption {
      margin-top: .7rem;
      font-size: 1.1rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #e4e4e4;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    /* The nearby cards peek in slightly */
    .samples-swiper .swiper-slide-next,
    .samples-swiper .swiper-slide-prev {
      opacity: 0.65;
      transform: scale(0.94) translateY(4px);
      filter: blur(0);
    }

    /* Active card is bright, sharp, and centered */
    .samples-swiper .swiper-slide-active {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: none;
      z-index: 5;
    }
    .samples-swiper .swiper-slide-active figcaption {
      opacity: 1;
      pointer-events: auto;
    }

    /* spinner for lazy load (matches existing style) */
    body.page-samples .gallery figure {
      position: relative;
    }
    body.page-samples .gallery figure.is-loading::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 32px; height: 32px;
      margin:-16px 0 0 -16px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color:#fff;
      animation: gallerySpin .9s linear infinite;
      pointer-events:none;
    }
    @keyframes gallerySpin { to { transform: rotate(360deg); } }

    /* ---------- Lightbox ---------- */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.85);
      display: none; place-items: center;
      z-index: 9999; padding: 20px;
    }
    .lightbox.open { display: grid; }
    .lightbox img {
      max-width: 92vw; max-height: 88vh;
      border-radius: 16px;
    }
    .lightbox-cap {
      color: #ccc;
      margin-top: 10px;
      text-align: center;
      max-width: 90vw;
    }
    .lightbox-close {
      position: absolute; top: 14px; right: 18px;
      background: #111; color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
      font-size: 20px; line-height: 1;
      padding: 8px 12px; cursor: pointer;
    }

    /* ---------- Video placeholder (lazy load) ---------- */
    .video-lazy {
      position: relative;
      width: 92vw;
      margin: 1.3rem auto 0 auto;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    .video-lazy::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 34px; height: 34px;
      margin:-17px 0 0 -17px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color:#fff;
      animation: videoSpin .8s linear infinite;
    }
    @keyframes videoSpin { to { transform: rotate(360deg); } }
  </style>
</head>

<body class="page-samples">
  <header>
    <div class="container nav">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Myles Photography LLC logo" class="logo" />
        <span>Myles Photography LLC</span>
      </a>
      <div class="services-tag">
        <span class="drone-wrap fly-in" aria-hidden="true">
          <img src="assets/drone.png" alt="Drone icon" class="services-drone">
        </span>
        <span>Drone Services</span>
      </div>
      <nav class="navlinks">
        <a href="samples.html" class="btn current">Sample Images</a>
        <a href="virtual-tours.html" class="btn">Virtual Tours</a>
        <a href="about.html" class="btn">About Us</a>
        <a href="locations.html" class="btn">Locations</a>
        <a href="payment.html" class="btn">Payment</a>
        <a href="contact.html" class="btn">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <!-- Intro panel with grey card + featured video -->
    <section class="panel panel-samples-intro">
      <div class="morph-bg"></div>
      <div class="content">
        <h1>Sample Work</h1>
        <p>Premium waterfront, downtown commercial, or middle of nowhere — we capture it all.</p>
        <div class="video-lazy" data-video-id="iVyg4wXB2MM" data-autoplay="1"></div>
      </div>
    </section>

    <!-- CARD DECK -->
    <section class="panel panel-gallery-deck">
      <div class="samples-swiper swiper">
        <div class="swiper-wrapper" id="samples-swiper-wrapper">
          <!-- slides injected by JS -->
        </div>
      </div>
    </section>

    <!-- Extra video panel at the end -->
    <section class="panel panel-more-video">
      <div class="morph-bg"></div>
      <div class="content">
        <h2 style="text-align:center;">More Video Samples</h2>
        <div class="video-lazy" data-video-id="INyz0gTMGc4" data-autoplay="0"></div>
        <div class="video-lazy" data-video-id="_XxktVZ8k-M" data-autoplay="0"></div>
      </div>
    </section>
  </main>

  <!-- Lightbox overlay -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close">×</button>
    <img id="lightbox-img" alt="" />
    <div id="lightbox-cap" class="lightbox-cap"></div>
  </div>

  <footer>
    <p>© 2025 Myles Photography LLC •
      <a href="mailto:nolanmyles@icloud.com">nolanmyles@icloud.com</a>
    </p>
  </footer>

  <!-- Swiper JS -->
  <script src="https://unpkg.com/swiper@11/swiper-bundle.min.js"></script>

  <script>
    // Build slides from manifest.json
    async function loadGalleryIntoSwiper() {
      const wrapper = document.getElementById('samples-swiper-wrapper');
      if (!wrapper) return;

      try {
        const res = await fetch('assets/samples/manifest.json');
        if (!res.ok) throw new Error('manifest not found');
        const data = await res.json();
        if (!Array.isArray(data.images)) throw new Error('invalid manifest');

        data.images.forEach(item => {
          const slide = document.createElement('div');
          slide.className = 'swiper-slide';

          const galleryWrap = document.createElement('div');
          galleryWrap.className = 'gallery';

          const fig = document.createElement('figure');
          fig.classList.add('is-loading');

          const link = document.createElement('a');
          link.className = 'lb';

          const img = document.createElement('img');
          img.src = 'assets/samples/' + item.src;
          img.alt = item.caption || 'Sample image';

          img.addEventListener('load', () => {
            fig.classList.remove('is-loading');
          });

          const cap = document.createElement('figcaption');
          cap.textContent = item.caption || '';

          link.href = img.src;
          link.appendChild(img);
          fig.appendChild(link);
          fig.appendChild(cap);
          galleryWrap.appendChild(fig);
          slide.appendChild(galleryWrap);
          wrapper.appendChild(slide);
        });

        initSwiper();   // only after slides exist
      } catch (err) {
        console.error(err);
        wrapper.innerHTML =
          '<div class="swiper-slide"><div class="gallery"><figure><figcaption style="color:#bbb">No manifest found. Create <code>assets/samples/manifest.json</code> to list your images.</figcaption></figure></div></div>';
        initSwiper();
      }
    }

    function initSwiper() {
      const swiperEl = document.querySelector('.samples-swiper');
      if (!swiperEl) return;

      const swiper = new Swiper('.samples-swiper', {
        effect: 'cards',
        grabCursor: true,
        slidesPerView: 1,
        centeredSlides: true,
        loop: true,
        cardsEffect: {
          perSlideOffset: 10,
          perSlideRotate: 1,
          rotate: true,
          slideShadows: false
        }
      });

      // Let mouse wheel / trackpad vertical scroll flip cards
      swiperEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY > 0) swiper.slideNext();
        else swiper.slidePrev();
      }, { passive: false });
    }

    // Lazy-load YouTube videos
    function initLazyVideos() {
      const videos = document.querySelectorAll('.video-lazy');
      if (!videos.length) return;

      function loadIframe(div) {
        const id = div.dataset.videoId;
        if (!id) return;
        const autoplay = div.dataset.autoplay === '1' ? '1' : '0';

        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${id}?autoplay=${autoplay}&mute=1`;
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;
        iframe.loading = "lazy";
        iframe.style.width = "100%";
        iframe.style.height = "100%";

        div.replaceWith(iframe);
      }

      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            loadIframe(entry.target);
            obs.unobserve(entry.target);
          });
        }, { rootMargin: '300px 0px' });

        videos.forEach(div => observer.observe(div));
      } else {
        videos.forEach(loadIframe);
      }
    }

    // Lightbox behaviour
    document.addEventListener('click', (e) => {
      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lightbox-img');
      const lbCap = document.getElementById('lightbox-cap');

      const openLink = e.target.closest('a.lb');
      if (openLink) {
        e.preventDefault();
        lbImg.src = openLink.querySelector('img').src;
        lbCap.textContent =
          openLink.parentElement.querySelector('figcaption')?.textContent || '';
        lb.classList.add('open');
        lb.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        return;
      }

      if (e.target.classList.contains('lightbox-close') || e.target === lb) {
        lb.classList.remove('open');
        lb.setAttribute('aria-hidden', 'true');
        lbImg.src = '';
        document.body.style.overflow = '';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadGalleryIntoSwiper();
      initLazyVideos();
    });
  </script>
</body>
</html>
