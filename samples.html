<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sample Images | Myles Photography LLC</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" type="image/png" href="assets/favicon.png" />

<style>
  /****************************************
   * PAGE SCROLL + PANEL SNAP BEHAVIOR
   ****************************************/
  main.page {
    scroll-snap-type: y mandatory;
    overflow-y: auto;
    overscroll-behavior-y: contain;
  }

  .panel {
    scroll-snap-align: center;
    padding: 1rem 0 2.2rem;
    position: relative;
    transition: opacity .35s ease;
  }

  .panel.active {
    opacity: 1;
  }

  /****************************************
   * INTRO + MORE VIDEO PANELS — GREY CARD
   ****************************************/
  .panel-samples-intro .morph-bg,
  .panel-more-video .morph-bg {
    background: linear-gradient(135deg, #8b8b8b, #333333);
    opacity: 1;
    border-radius: 25px;
    padding: 2rem;
    max-width: 90%;
    margin: 0 auto;
  }

  .panel-samples-intro .content,
  .panel-more-video .content {
    max-width: 90%;
    margin: 0 auto;
  }

  /****************************************
   * STACKED DECK — IMAGE GALLERY PANELS
   ****************************************/
  .panel-gallery {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 85vh;
    pointer-events: none;
  }

  .panel-gallery .content {
    pointer-events: auto;
  }

  .panel-gallery .gallery figure {
    max-width: 80vw;
    margin: 0 auto;
    border-radius: 22px;
    text-align: center;
  }

  .panel-gallery .gallery img {
    width: 100%;
    height: auto;
    max-height: 40vh;
    border-radius: 22px;
    object-fit: contain;
  }

  .panel-gallery .gallery figcaption {
    font-size: 1.15rem;
    margin-top: 0.4rem;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: white;
  }

  /* hover / active brightness */
  .panel-gallery:not(.active) img {
    filter: brightness(55%);
  }

  /****************************************
   * STACKED CARD EFFECT
   ****************************************/
  main.page {
    perspective: 1100px;
  }

  .panel-gallery {
    transform-style: preserve-3d;
    transform-origin: center bottom;
    opacity: .8;
    transform: translateY(60px) scale(.92) rotateX(-9deg);
  }

  .panel-gallery.active {
    opacity: 1;
    transform: translateY(0) scale(1) rotateX(0);
  }

  /****************************************
   * ✨ FIX VIDEO ASPECT RATIO (ALL SAMPLE VIDEOS)
   ****************************************/
  .video-lazy,
  .panel-samples-intro .video-lazy,
  .panel-more-video .video-lazy {
    width: 100%;
    max-width: 90%;
    margin: 1.3rem auto 0 auto;
    border-radius: 18px;
    overflow: hidden;

    /* Matches your images — prevents tall stretching */
    aspect-ratio: 16 / 9;
    background: #111; /* prevents white flash */
  }

  .video-lazy iframe {
    width: 100%;
    height: 100%;
    display: block;
  }

  /****************************************
   * LIGHTBOX
   ****************************************/
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: none; place-items: center;
    z-index: 9999; padding: 20px;
  }
  .lightbox.open { display: grid; }
  .lightbox img {
    max-width: 92vw; max-height: 88vh;
    border-radius: 16px;
  }
  .lightbox-close {
    position: absolute; top: 14px; right: 18px;
    background: #111; color: #fff;
    border: 1px solid #333;
    border-radius: 10px;
    font-size: 20px; line-height: 1;
    padding: 8px 12px; cursor: pointer;
  }
</style>
</head>


<body class="page-samples">

<header>
  <div class="container nav">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="Myles Photography LLC logo" class="logo" />
      <span>Myles Photography LLC</span>
    </a>
    <div class="services-tag">
      <img src="assets/drone.png" class="services-drone" alt="Drone icon" />
      <span>Drone Services</span>
    </div>
    <nav class="navlinks">
      <a href="samples.html" class="btn current">Sample Images</a>
      <a href="virtual-tours.html" class="btn">Virtual Tours</a>
      <a href="about.html" class="btn">About Us</a>
      <a href="locations.html" class="btn">Locations</a>
      <a href="payment.html" class="btn">Payment</a>
      <a href="contact.html" class="btn">Contact</a>
    </nav>
  </div>
</header>


<!-- ====================== PAGE BODY ======================== -->
<main class="page">

  <section class="panel panel-samples-intro">
    <div class="morph-bg">
      <div class="content">
        <h1>Sample Work</h1>
        <p>Premium waterfront, downtown commercial & remote — we capture it all.</p>

        <!-- Intro Sample Video -->
        <div class="video-lazy" data-video-id="iVyg4wXB2MM"></div>

      </div>
    </div>
  </section>

  <div id="gallery-panels-anchor"></div>

  <section class="panel panel-more-video">
    <div class="morph-bg">
      <div class="content">
        <h2>More Video Samples</h2>

        <div class="video-lazy" data-video-id="INyz0gTMGc4"></div>
        <div class="video-lazy" data-video-id="_XxktVZ8k-M"></div>
      </div>
    </div>
  </section>
</main>


<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" aria-hidden="true">
  <button class="lightbox-close">×</button>
  <img id="lightbox-img" alt=""/>
</div>


<footer>
  <p>© 2025 Myles Photography LLC •
    <a href="mailto:nolanmyles@icloud.com">nolanmyles@icloud.com</a></p>
</footer>


<!-- ====================== SCRIPTS ======================== -->
<script>
let panelObserver = null;

function setupPanelObserver() {
  if (panelObserver) return;
  panelObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
        entry.target.classList.add("active");
      }
    });
  },{threshold:.45});
}

async function loadGallery(){
  const anchor = document.getElementById('gallery-panels-anchor');
  try{
    const res = await fetch('assets/samples/manifest.json');
    const data = await res.json();
    data.images.forEach(item=>{
      const panel = document.createElement('section');
      panel.className='panel panel-gallery';
      const content=document.createElement('div');
      content.className='content';
      const wrap=document.createElement('div');
      wrap.className='gallery';
      const fig=document.createElement('figure');
      const link=document.createElement('a');
      link.className='lb';
      const img=document.createElement('img');
      img.src='assets/samples/'+item.src;
      img.alt=item.caption||'Sample';
      const cap=document.createElement('figcaption');
      cap.textContent=item.caption||'';
      link.appendChild(img);
      fig.appendChild(link);
      fig.appendChild(cap);
      wrap.appendChild(fig);
      content.appendChild(wrap);
      panel.appendChild(content);
      anchor.appendChild(panel);
      setupPanelObserver();
      panelObserver.observe(panel);
    });
  }catch(err){
    console.log(err);
  }
}

/* Lazy YouTube */
function initLazyVideos(){
  document.querySelectorAll('.video-lazy').forEach(div=>{
    const id=div.dataset.videoId;
    const iframe=document.createElement('iframe');
    iframe.src=`https://www.youtube.com/embed/${id}?autoplay=0&mute=1`;
    iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    iframe.allowFullscreen=true;
    iframe.loading="lazy";
    div.appendChild(iframe);
  });
}

/* Lightbox */
document.addEventListener('click',e=>{
  const lb=document.getElementById('lightbox');
  const imgElem=document.getElementById('lightbox-img');
  const openLink=e.target.closest('a.lb');
  if(openLink){
    e.preventDefault();
    imgElem.src=openLink.querySelector('img').src;
    lb.classList.add('open');
    return;
  }
  if(e.target.classList.contains('lightbox-close')||e.target===lb){
    lb.classList.remove('open');
    imgElem.src='';
  }
});

document.addEventListener('DOMContentLoaded', ()=>{
  setupPanelObserver();
  document.querySelectorAll('.panel').forEach(p=>panelObserver.observe(p));
  loadGallery();
  initLazyVideos();
});
</script>

</body>
</html>
