<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sample Images | Myles Photography LLC</title>

<!-- Swiper -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

<style>
/* ----------------------------------
   GLOBAL — same feel as index 
---------------------------------- */
body {
  margin:0;
  padding:0;
  background:#000;
  color:#fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior-y: contain;
}
header {
  background:#eee;
  padding:1.2rem 1rem .7rem;
  color:#000;
}
.navlinks a {
  margin:.3rem .25rem;
  padding:.55rem 1.05rem;
  border:2px solid #000;
  border-radius:12px;
  text-decoration:none;
  color:#000;
  font-size:.98rem;
  display:inline-block;
}
.navlinks .current {
  background:#000;
  color:#fff;
}

main.page {
  scroll-snap-type:y mandatory;
  overflow-y:auto;
}

/* ----------------------------------
   FIX: panels not dimmed here
---------------------------------- */
body.page-samples .panel,
body.page-samples .panel .content {
  opacity:1 !important;
  transform:none !important;
  filter:none !important;
}

/* ----------------------------------
   Intro + outro panels
---------------------------------- */
.panel {
  scroll-snap-align:center;
  padding:1.6rem 0 2.4rem;
}
.panel-samples-intro .morph-bg,
.panel-more-video .morph-bg {
  background:linear-gradient(135deg,#8b8b8b,#333);
  border-radius:24px;
  width:88%;
  margin:0 auto;
  padding:1.6rem;
}
.panel-samples-intro h1 {
  margin-top:0;
}

/* ----------------------------------
   VIDEO lazy placeholder
---------------------------------- */
.video-lazy {
  width:100%;
  max-width:88%;
  margin:1.2rem auto 0;
  background:#111;
  border-radius:18px;
  aspect-ratio:16/9;
  overflow:hidden;
}

/* ----------------------------------
   STACKED DECK GALLERY
---------------------------------- */
.samples-swiper {
  width:100%;
  padding:3rem 0 4rem;
  height:440px;       /* card zone */
}

.samples-swiper .swiper-wrapper {
  align-items:center;
}

/* base card look */
.samples-swiper .swiper-slide {
  width:82vw;
  max-width:460px;
  background:#111;
  border-radius:20px;
  opacity:.35;
  transform:scale(.92);
  transition:transform .4s ease, opacity .4s ease;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

/* active card bright & centered */
.samples-swiper .swiper-slide-active {
  opacity:1;
  transform:scale(1);
  z-index:30;
}

/* slightly highlight neighbors */
.samples-swiper .swiper-slide-next,
.samples-swiper .swiper-slide-prev {
  opacity:.65;
}

/* hide captions on non-active */
.samples-swiper .swiper-slide figcaption {
  font-size:1.15rem;
  margin-top:.55rem;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#fff;
  opacity:0;
  transition:.35s ease;
}
.samples-swiper .swiper-slide-active figcaption {
  opacity:1;
}

/* card images */
.samples-swiper img {
  width:100%;
  height:auto;
  border-radius:20px;
  display:block;
}

/* give a sense of stacking — shadows */
.samples-swiper .swiper-slide {
  box-shadow:0 6px 16px rgba(0,0,0,.45);
}

/* swipe up/down allowed (free wheel) */
.samples-swiper {
  touch-action:pan-y pan-x;
}

/* footer */
footer {
  text-align:center;
  padding:.9rem;
  background:#111;
  color:#bbb;
  font-size:.85rem;
  border-top:1px solid #222;
}
</style>
</head>

<body class="page-samples">
<header>
  <div class="navlinks">
    <a href="samples.html" class="current">Sample Images</a>
    <a href="virtual-tours.html">Virtual Tours</a>
    <a href="about.html">About Us</a>
    <a href="locations.html">Locations</a>
    <a href="payment.html">Payment</a>
    <a href="contact.html">Contact</a>
  </div>
</header>

<main class="page">
  <!-- Intro Featured -->
  <section class="panel panel-samples-intro">
    <div class="morph-bg">
      <h1>Sample Work</h1>
      <p>High-end real estate, waterfront, commercial & rural — we capture it clean.</p>
      <div class="video-lazy" data-video-id="iVyg4wXB2MM" data-autoplay="1"></div>
    </div>
  </section>

  <!-- STACKED GALLERY -->
  <section class="panel">
    <div class="samples-swiper swiper">
      <div class="swiper-wrapper" id="gallery-wrapper"></div>
    </div>
  </section>

  <!-- Outro -->
  <section class="panel panel-more-video">
    <div class="morph-bg">
      <h2>More Video Samples</h2>
      <div class="video-lazy" data-video-id="INyz0gTMGc4"></div>
    </div>
  </section>

</main>

<footer>
  © 2025 Myles Photography LLC • nolanmyles@icloud.com
</footer>

<!-- Swiper -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
/* load images from your manifest */
async function loadGallery(){
  const res = await fetch('assets/samples/manifest.json');
  const data = await res.json();
  const wrap = document.getElementById("gallery-wrapper");

  data.images.forEach(img=>{
    const el=document.createElement("div");
    el.className="swiper-slide";
    el.innerHTML=`
      <figure>
        <img src="assets/samples/${img.src}" alt="">
        <figcaption>${img.caption||""}</figcaption>
      </figure>`;
    wrap.appendChild(el);
  });
}

/* lazy load video */
function initLazyVideos(){
  document.querySelectorAll(".video-lazy").forEach(v=>{
    const id=v.dataset.videoId;
    const auto=v.dataset.autoplay==="1"?"1":"0";
    const iframe=document.createElement("iframe");
    iframe.src=`https://www.youtube.com/embed/${id}?autoplay=${auto}&mute=1`;
    iframe.allowFullscreen=true;
    iframe.style.width="100%";
    iframe.style.height="100%";
    v.replaceWith(iframe);
  });
}

/* init deck */
async function init(){
  await loadGallery();

  new Swiper('.samples-swiper',{
    effect:"slide",
    centeredSlides:true,
    slidesPerView:"auto",
    spaceBetween: -140,          /* overlap = stacking */
    freeMode:true,               /* allows vertical scrolling */
    freeModeSticky:true,
    mousewheel:true,             /* wheel = up/down shuffle */
    grabCursor:true
  });

  initLazyVideos();
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
