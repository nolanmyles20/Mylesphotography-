<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Images | Myles Photography LLC</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- Swiper for stacked cards -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/swiper@11/swiper-bundle.min.css"
  />

  <!-- PAGE-SPECIFIC STYLES -->
  <style>
    /* Turn OFF page scroll-snap here so Swiper controls the motion */
    main.page {
      scroll-snap-type: none;
      overflow-y: auto;
    }

    /* Intro + More Video panels keep the grey morph card */
    body.page-samples .panel-samples-intro .morph-bg,
    body.page-samples .panel-more-video .morph-bg {
      background: linear-gradient(135deg, #8b8b8b, #333333);
      opacity: 1;
    }
    body.page-samples .panel-samples-intro .content,
    body.page-samples .panel-more-video .content {
      max-width: 88%;
      margin: 0 auto;
    }

    /* ---------- SWIPER STACKED CARDS GALLERY ---------- */

    .samples-swiper {
      width: 100%;
      max-width: 480px;
      height: 70vh;
      margin: 2rem auto 3rem auto;
    }

    .samples-swiper .swiper-wrapper {
      align-items: center;
    }

    .samples-swiper .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Card layout inside each slide */
    .samples-swiper figure {
      margin: 0;
      width: 100%;
      max-width: 90%;
      text-align: center;
      border-radius: 22px;
      background: transparent;
      position: relative;
    }

    .samples-swiper img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 40vh;
      object-fit: contain;
      border-radius: 22px;
    }

    .samples-swiper figcaption {
      margin-top: 0.7rem;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #e4e4e4;
    }

    /* Loading spinner for each image */
    .samples-swiper figure.is-loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 32px;
      height: 32px;
      margin: -16px 0 0 -16px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      animation: gallerySpin 0.9s linear infinite;
      pointer-events: none;
    }

    @keyframes gallerySpin {
      to { transform: rotate(360deg); }
    }

    /* Swiper pagination dots (optional) */
    .samples-swiper .swiper-pagination-bullet {
      background: #fff;
      opacity: 0.5;
    }
    .samples-swiper .swiper-pagination-bullet-active {
      opacity: 1;
    }

    /* ---------- Lightbox ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      place-items: center;
      z-index: 9999;
      padding: 20px;
    }
    .lightbox.open { display: grid; }
    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 16px;
    }
    .lightbox-cap {
      color: #ccc;
      margin-top: 10px;
      text-align: center;
      max-width: 90vw;
    }
    .lightbox-close {
      position: absolute;
      top: 14px;
      right: 18px;
      background: #111;
      color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1;
      padding: 8px 12px;
      cursor: pointer;
    }

    /* ---------- Video placeholder (lazy load) ---------- */
    .video-lazy {
      position: relative;
      width: 92vw;
      margin: 1.3rem auto 0 auto;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    .video-lazy::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 34px;
      height: 34px;
      margin: -17px 0 0 -17px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      animation: videoSpin 0.8s linear infinite;
    }
    @keyframes videoSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body class="page-samples">
  <header>
    <div class="container nav">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Myles Photography LLC logo" class="logo" />
        <span>Myles Photography LLC</span>
      </a>
      <div class="services-tag">
        <span class="drone-wrap fly-in" aria-hidden="true">
          <img src="assets/drone.png" alt="Drone icon" class="services-drone">
        </span>
        <span>Drone Services</span>
      </div>
      <nav class="navlinks">
        <a href="samples.html" class="btn current">Sample Images</a>
        <a href="virtual-tours.html" class="btn">Virtual Tours</a>
        <a href="about.html" class="btn">About Us</a>
        <a href="locations.html" class="btn">Locations</a>
        <a href="payment.html" class="btn">Payment</a>
        <a href="contact.html" class="btn">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <!-- Intro panel with grey card + featured video -->
    <section class="panel panel-samples-intro">
      <div class="morph-bg"></div>
      <div class="content">
        <h1>Sample Work</h1>
        <p>Premium waterfront, downtown commercial, or middle of nowhere — we capture it all.</p>
        <div class="video-lazy" data-video-id="iVyg4wXB2MM" data-autoplay="1"></div>
      </div>
    </section>

    <!-- Swiper stacked-cards gallery -->
    <section class="panel panel-gallery-swiper">
      <div class="content">
        <div class="samples-swiper swiper">
          <div class="swiper-wrapper" id="samples-swiper-wrapper">
            <!-- slides injected here -->
          </div>
          <div class="swiper-pagination"></div>
        </div>
      </div>
    </section>

    <!-- Extra video panel at the end -->
    <section class="panel panel-more-video">
      <div class="morph-bg"></div>
      <div class="content">
        <h2 style="text-align:center;">More Video Samples</h2>
        <div class="video-lazy" data-video-id="INyz0gTMGc4" data-autoplay="0"></div>
        <div class="video-lazy" data-video-id="_XxktVZ8k-M" data-autoplay="0"></div>
      </div>
    </section>
  </main>

  <!-- Lightbox overlay -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close">×</button>
    <img id="lightbox-img" alt="" />
    <div id="lightbox-cap" class="lightbox-cap"></div>
  </div>

  <footer>
    <p>© 2025 Myles Photography LLC • <a href="mailto:nolanmyles@icloud.com">nolanmyles@icloud.com</a></p>
  </footer>

  <!-- Swiper JS -->
  <script src="https://unpkg.com/swiper@11/swiper-bundle.min.js"></script>

  <script>
    async function loadGallery() {
      const wrapper = document.getElementById('samples-swiper-wrapper');
      if (!wrapper) return;

      try {
        const res = await fetch('assets/samples/manifest.json');
        if (!res.ok) throw new Error('manifest not found');
        const data = await res.json();
        if (!data.images || !Array.isArray(data.images)) throw new Error('invalid manifest');

        data.images.forEach(item => {
          const slide = document.createElement('div');
          slide.className = 'swiper-slide';

          const fig = document.createElement('figure');
          fig.classList.add('is-loading');

          const link = document.createElement('a');
          link.className = 'lb';

          const img = document.createElement('img');
          img.src = 'assets/samples/' + item.src;
          img.alt = item.caption || 'Sample image';
          img.loading = 'lazy';

          img.addEventListener('load', () => {
            fig.classList.remove('is-loading');
          });

          const cap = document.createElement('figcaption');
          cap.textContent = item.caption || '';

          link.href = img.src;
          link.appendChild(img);
          fig.appendChild(link);
          fig.appendChild(cap);
          slide.appendChild(fig);
          wrapper.appendChild(slide);
        });

        // Init Swiper after slides are added
        new Swiper('.samples-swiper', {
          effect: 'cards',
          grabCursor: true,
          loop: false,
          centeredSlides: true,
          slidesPerView: 1,
          cardsEffect: {
            perSlideOffset: 10,
            perSlideRotate: 2,
            slideShadows: false
          },
          pagination: {
            el: '.swiper-pagination',
            clickable: true
          }
        });

      } catch (e) {
        console.error(e);
        wrapper.innerHTML =
          '<div class="swiper-slide"><p style="color:#bbb; text-align:center;">No manifest found. Create <code>assets/samples/manifest.json</code> to list your images.</p></div>';
      }
    }

    function initLazyVideos() {
      const videos = document.querySelectorAll('.video-lazy');
      if (!videos.length) return;

      function loadIframe(div) {
        const id = div.dataset.videoId;
        if (!id) return;
        const autoplay = div.dataset.autoplay === '1' ? '1' : '0';

        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${id}?autoplay=${autoplay}&mute=1`;
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;
        iframe.loading = "lazy";
        iframe.style.width = "100%";
        iframe.style.height = "100%";

        div.replaceWith(iframe);
      }

      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            loadIframe(entry.target);
            obs.unobserve(entry.target);
          });
        }, { rootMargin: '300px 0px' });

        videos.forEach(div => observer.observe(div));
      } else {
        videos.forEach(loadIframe);
      }
    }

    // Lightbox behavior
    document.addEventListener('click', (e) => {
      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lightbox-img');
      const lbCap = document.getElementById('lightbox-cap');

      const openLink = e.target.closest('a.lb');
      if (openLink) {
        e.preventDefault();
        const fig = openLink.closest('figure');
        lbImg.src = openLink.querySelector('img').src;
        lbCap.textContent = fig.querySelector('figcaption')?.textContent || '';
        lb.classList.add('open');
        lb.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        return;
      }

      if (e.target.classList.contains('lightbox-close') || e.target === lb) {
        lb.classList.remove('open');
        lb.setAttribute('aria-hidden', 'true');
        lbImg.src = '';
        document.body.style.overflow = '';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadGallery();
      initLazyVideos();
    });
  </script>
</body>
</html>
